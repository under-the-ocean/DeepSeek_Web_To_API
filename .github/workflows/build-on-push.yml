name: Build & Release on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  IMAGE_NAME: ghcr.io/meow-calculations/deepseek-web-to-api

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ -f VERSION ]; then
            BASE_VER="$(tr -d '[:space:]' < VERSION)"
          else
            BASE_VER="0.0.0"
          fi
          echo "tag=${BASE_VER}-ci.${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${BASE_VER}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        run: |
          npm ci --prefix webui --prefer-offline --no-audit
          npm run build --prefix webui

      - name: Build Multi-Platform Archives
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_JOBS: "2"
        run: bash ./scripts/build-release-archives.sh

      - name: Prepare Docker release inputs
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          mkdir -p dist/docker-input
          cp "dist/deepseek-web-to-api_${TAG}_linux_amd64.tar.gz" "dist/docker-input/linux_amd64.tar.gz"
          cp "dist/deepseek-web-to-api_${TAG}_linux_arm64.tar.gz" "dist/docker-input/linux_arm64.tar.gz"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export Docker Images
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            --target runtime-from-dist \
            --cache-from type=gha \
            --output type=docker,dest="dist/deepseek-web-to-api_${TAG}_docker_linux_amd64.tar" \
            .

          docker buildx build \
            --platform linux/arm64 \
            --target runtime-from-dist \
            --cache-from type=gha \
            --output type=docker,dest="dist/deepseek-web-to-api_${TAG}_docker_linux_arm64.tar" \
            .

          gzip -f "dist/deepseek-web-to-api_${TAG}_docker_linux_amd64.tar"
          gzip -f "dist/deepseek-web-to-api_${TAG}_docker_linux_arm64.tar"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt)

      - name: Create / Update Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          FILES=(
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          )

          RELEASE_TITLE="CI Build ${TAG}"
          RELEASE_NOTES="Auto-built from commit ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}"

          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${TAG}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            "${FILES[@]}"
