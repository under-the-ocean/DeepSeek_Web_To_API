name: Auto Build on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23.x"
  NODE_VERSION: "24"
  BUILD_VERSION: "dev"

jobs:
  build-webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        run: |
          npm ci --prefix webui --prefer-offline --no-audit
          npm run build --prefix webui

      - name: Upload WebUI
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/

  build:
    needs: build-webui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64, label: linux_amd64 }
          - { goos: linux, goarch: arm64, label: linux_arm64 }
          - { goos: linux, goarch: arm, goarm: "7", label: linux_armv7 }
          - { goos: darwin, goarch: amd64, label: darwin_amd64 }
          - { goos: darwin, goarch: arm64, label: darwin_arm64 }
          - { goos: windows, goarch: amd64, label: windows_amd64 }
          - { goos: windows, goarch: arm64, label: windows_arm64 }
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (no cache to avoid conflicts)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Download WebUI
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/

      - name: Build Binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm || '' }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.target.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -v -ldflags="-X main.Version=${{ env.BUILD_VERSION }}"             -o "dist/deepseek-web-to-api_${{ matrix.target.label }}${ext}"             ./cmd/DeepSeek_Web_To_API/

      - name: Package (Unix)
        if: matrix.target.goos != 'windows'
        run: |
          cd dist
          tar czf "deepseek-web-to-api_${{ matrix.target.label }}.tar.gz"             "deepseek-web-to-api_${{ matrix.target.label }}"

      - name: Package (Windows)
        if: matrix.target.goos == 'windows'
        run: |
          cd dist
          zip "deepseek-web-to-api_${{ matrix.target.label }}.zip"             "deepseek-web-to-api_${{ matrix.target.label }}.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-web-to-api_${{ matrix.target.label }}
          path: dist/deepseek-web-to-api_${{ matrix.target.label }}.*
